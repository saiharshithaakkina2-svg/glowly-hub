<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products</title>
   

    <link rel="stylesheet" href="css/products.css">
</head>

<body>

    <!-- Product Heading -->

    <h1 class="product-heading">
        Shop Your Product
    </h1>

<div class="searchAndFilterbtns">

    <input
        id="search"
        type="search"
        placeholder="Search your product"
    />

    <div class="sort-container">

        <button id="dropdownbtn"  type="button">
            Sort By ▼
        </button>

        <div id="dropdownmenu" class="dropdownmenu">

            <button id="lowToHigh" type="button">
                Price: Low to High
            </button>

            <button id="highToLow" type="button">
                Price: High to Low
            </button>

        </div>

    </div>

</div>

<p id="errorMessage" role="status"></p>

    <!-- Products Container -->

    <div class="products-container" id="fetchAllProducts">

        <!-- Products will come from JSON -->

    </div>


    <script  type="module" src="Js/fetchAllProducts.js"></script>

</body>

</html>
