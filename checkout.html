<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/checkout.css">
</head>
<body>

<div class="checkout-container">

    <h1>Checkout</h1>

    <div class="checkout-layout">

        <!-- Customer Details -->
        <div class="checkout-form">

            <h2>Customer Details</h2>

            <form id="checkoutForm">

                <!-- Name -->
                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                    >

                    <small id="nameError"></small>

                </div>


                <!-- Address -->
                <div class="form-group">

                    <label for="address">
                        Address
                    </label>

                    <textarea
                        id="address"
                        placeholder="Enter your address"
                    ></textarea>

                    <small id="addressError"></small>

                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                    <small id="emailError"></small>

                </div>


                <!-- Payment -->
                <div class="form-group">

                    <label for="payment">
                        Payment Method
                    </label>

                    <select id="payment">

                        <option value="">
                            Select Payment Method
                        </option>

                        <option value="cod">
                            Cash on Delivery
                        </option>

                        <option value="card">
                            Credit / Debit Card
                        </option>

                        <option value="upi">
                            UPI
                        </option>

                    </select>

                    <small id="paymentError"></small>

                </div>


                <button
                    type="submit"
                    id="placeOrderBtn"
                >
                    Place Order
                </button>

            </form>

        </div>


        <!-- Order Summary -->
        <div class="order-summary">

            <h2>Order Summary</h2>

            <div id="checkoutItems"></div>

            <div class="checkout-total">

                <h2>
                    Total:
                    <span id="checkoutTotal">
                        $0
                    </span>
                </h2>

            </div>

        </div>

    </div>


    <!-- Order Confirmation -->
    <div id="orderMessage"></div>

</div>


</body>
<script src ='/Js/checkout.js'></script>
</html>
