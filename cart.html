<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GlowHub - Cart</title>

    <link rel="stylesheet" href="/css/cart.css">

</head>

<body>

    <!-- Header -->


    <!-- Cart -->

    <main>

        <h1>Your Shopping Cart</h1>

        <div class="cart-container">

            <!-- Cart products -->

            <div id="cartItems">

                <!-- Products will come from JavaScript -->

            </div>


            <!-- Cart Summary -->

            <div class="cart-summary">

                <h2>Order Summary</h2>

                <div class="summary-row">

                    <span>Subtotal</span>

                    <span id="subtotal">$0</span>

                </div>


                <div class="summary-row">

                    <span>Shipping</span>

                    <span>Free</span>

                </div>


                <hr>


                <div class="total-row">

                    <span>Total</span>

                    <span id="total">$0</span>

                </div>

<button id="checkoutBtn" class="checkout-btn">
    Proceed to Checkout
</button>

            </div>

        </div>

    </main>


  

    <script src="Js/cart.js"></script>

</body>

</html>
